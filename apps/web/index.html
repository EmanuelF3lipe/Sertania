<!doctype html>
<!--
  `lang="pt-BR"` nao e detalhe de traducao: leitores de tela usam o atributo para
  escolher a regra de pronuncia, e sem ele a leitura de um texto em portugues com
  fonetica inglesa atrapalha quem tem baixa visao.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport` sem `user-scalable=no`: impedir o zoom quebra a acessibilidade
      de quem precisa aumentar a letra. A prefeitura nao pode escolher isso em
      nome de quem usa.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#082f29" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Sertania: serviços públicos mais simples, acessíveis e próximos de você." />
    <meta property="og:title" content="Sertania - Prefeitura Municipal" />
    <meta property="og:description" content="Resolva o que precisa com a Prefeitura de Sertania em um só lugar." />
    <meta property="og:type" content="website" />
    <title>Sertania | Prefeitura Municipal</title>
  </head>
  <body>
    <!--
      O `noscript` existe porque a interface depende de JavaScript. Sem esta
      mensagem, quem tem o scripting desligado ve uma pagina em branco, sem
      nenhuma pista do que aconteceu.
    -->
    <noscript>
      Este servico precisa de JavaScript para funcionar. Se voce nao consegue usa-lo,
      ligue para a prefeitura e faremos o atendimento por telefone.
    </noscript>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
