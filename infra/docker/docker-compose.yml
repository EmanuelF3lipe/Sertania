# Stack local de desenvolvimento (especificacao secao 18).
#
# Servicos exigidos pela especificacao: PostgreSQL/PostGIS, Redis, Keycloak,
# emulador S3, ClamAV e caixa de e-mail de teste.
#
# Decisoes deliberadas, e o porque:
#
# - Redis de sessao e Redis de fila sao INSTANCIAS SEPARADAS. Um trabalho nao
#   pode se perder por uma politica de eviction de cache (secao 18).
# - Keycloak tem banco e credenciais proprios, independentes do banco de
#   negocio (secao 18).
# - A versao da imagem e sempre explicita. Imagem com `latest` impede
#   reproducibilidade e a especificacao pede versions fixadas (secao 9).
# - Servicos ficam em rede privada. Somente os que precisam de acesso do host
#   publicam porta em 127.0.0.1, e nunca em 0.0.0.0.
# - Credenciais aqui sao de DEMONSTRACAO e so existem neste arquivo. Nao entram
#   na configuracao de producao (secao 18).
#
# Uso:
#   cp .env.example .env
#   docker compose -f infra/docker/docker-compose.yml --env-file .env up -d
#
# Para conferir a saude de tudo:
#   docker compose -f infra/docker/docker-compose.yml --env-file .env ps

name: sertania

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &restart
  restart: unless-stopped

services:
  # --- Banco de negocio -------------------------------------------------
  # PostGIS 3.5 sobre PostgreSQL 17, versao 17 dentro da politica de suporte
  # consultada pela especificacao.
  postgres:
    image: postgis/postgis:17-3.5
    <<: [*logging, *restart]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sertania}
      # A conta da aplicacao e criada aqui pelo bootstrap da imagem do Postgres,
      # que a torna SUPERUSUARIA. Este comentario antes dizia o contrario, e a
      # afirmacao estava errada: nada no compose reduz o privilegio depois.
      # Ver `pendencia-conta-superusuario` em `docs/ESTADO_IMPLEMENTACAO.md`.
      #
      # Migracoes do banco de TRABALHO usam conta separada (POSTGRES_MIGRATOR_*),
      # conforme a secao 11. O banco de TESTE tem contas proprias e com menos
      # privilegio ainda, criadas por `infra/docker/postgres/provisionar.mjs`.
      POSTGRES_USER: ${POSTGRES_USER:-sertania_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local-apenas}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      # Horarios em UTC no servidor. A camada de aplicacao converte para
      # America/Recife ao calcular prazo (secao 8).
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - max_connections=200
      # Query e parametro parametrizado sao obrigatorios na aplicacao; aqui
      # fica apenas a conexao. A conta da aplicacao nao tem superusuario nem
      # direito de alterar estrutura.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready sozinho nao garante que o PostGIS carregou. Consultar a
      # extensao evita considerar pronto um banco sem suporte espacial.
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "${POSTGRES_USER:-sertania_app}" -d "${POSTGRES_DB:-sertania}"
          && psql -U "${POSTGRES_USER:-sertania_app}" -d "${POSTGRES_DB:-sertania}"
          -tAc "SELECT 1 FROM pg_extension WHERE extname='postgis'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # O banco e alcancavel pela aplicacao e fica em rede isolada, sem saida
    # para a internet. Publicar a porta no host e opcional e fica desligado
    # por padrao; ligue com -Dpostgres.port=1 quando precisar inspecionar.
    networks: [sertania-app-net, sertania-data-net]

  # --- Banco do Keycloak ----------------------------------------------
  # Instancia separada: o Keycloak usa banco e credenciais proprios.
  keycloak-db:
    image: postgres:17
    <<: [*logging, *restart]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-apenas}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Sem porta publicada e em rede isolada: so o Keycloak fala com este banco.
    networks: [sertania-app-net, sertania-data-net]

  # --- Redis de sessao --------------------------------------------------
  # Guarda sessoes no servidor. Politica de memoria sem eviction de chaves com
  # TTL: perder uma sessao e aceitavel, perder um job nao.
  redis-session:
    image: redis:8.6-alpine
    <<: [*logging, *restart]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_SESSION_PASSWORD:-redis-sessao-local}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis-session-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_SESSION_PASSWORD:-redis-sessao-local}
    networks: [sertania-app-net, sertania-data-net]

  # --- Redis de fila ----------------------------------------------------
  # Instancia e politica SEPARADAS da sessao. `noeviction` e intencional: um
  # job pendente nunca pode ser descartado por pressao de memoria.
  redis-queue:
    image: redis:8.6-alpine
    <<: [*logging, *restart]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_QUEUE_PASSWORD:-redis-fila-local}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-queue-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_QUEUE_PASSWORD:-redis-fila-local}
    # Instancia fisicamente separada da sessao: um eviction de cache nunca
    # pode derrubar um trabalho pendente (secao 18).
    networks: [sertania-app-net, sertania-data-net]

  # --- Emulador S3 (RustFS) --------------------------------------------
  # Armazenamento privado de desenvolvimento, compativel com a API S3. Os
  # buckets NAO tem leitura publica em nenhum momento (secao 13).
  #
  # NOTA: a especificacao previa um emulador S3 sem nomear fornecedor. MinIO
  # deixou de publicar imagem publica (Docker Hub responde 404 e o Quay exige
  # autenticacao), entao uso RustFS, que expoe a mesma interface S3. Trocar de
  # fornecedor em producao nao exige mudanca no codigo: a API fala S3.
  rustfs:
    image: rustfs/rustfs:1.0.0
    <<: [*logging, *restart]
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-sertania-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-sertania-local-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [sertania-app-net]

  # --- ClamAV -----------------------------------------------------------
  # Uma das camadas de inspecao. Resultado limpo nao prova que o arquivo e
  # inofensivo (secao 13). O worker aplica limites de CPU, memoria e tempo.
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    <<: [*logging, *restart]
    # ClamAV precisa de memoria para a base de assinaturas.
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      # O banco de assinaturas pode levar minutos para baixar na primeira
      # execucao. start_period generoso evita reinicio em loop.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [sertania-app-net]

  # --- Caixa de e-mail de teste ----------------------------------------
  # Mailpit: e-mail descartavel, sem entrega real. Nenhum endereco de cidadao
  # pode ser alcancado a partir deste ambiente.
  mailpit:
    image: axllent/mailpit:v1.31.3
    <<: [*logging, *restart]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sertania-app-net]

  # --- Keycloak ---------------------------------------------------------
  # Dois realms: cidadaos e servidores. O institucional tem autocadastro
  # desligado; o primeiro acesso usa convite por e-mail e verificacao Turnstile.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    <<: [*logging, *restart]
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-apenas}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Senha do usuario administrativo do realm master. Trocar em qualquer
      # ambiente que nao seja local.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local-apenas}
      # O start-dev e tolerado APENAS no ambiente local. Producao usa start com
      # HTTPS e proxy proprio.
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q '"status": "UP"'
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [sertania-app-net]

networks:
  # Rede de servicos que NAO precisam ser alcancados nem sair para a internet:
  # bancos e filas. Ficam isolados da rede externa.
  sertania-data-net:
    driver: bridge
    internal: true

  # Rede dos servicos que o host e a aplicacao precisam alcancar (Keycloak,
  # S3, ClamAV, SMTP). Nao pode ser `internal`, senao o Docker nao cria o
  # encaminhamento das portas publicadas e o servico fica inacessivel.
  sertania-app-net:
    driver: bridge

volumes:
  postgres-data:
  keycloak-db-data:
  redis-session-data:
  redis-queue-data:
  rustfs-data:
  clamav-data:
