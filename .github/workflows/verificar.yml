# Fluxo local de verificacao.
#
# Nao copiar este arquivo para outro repositorio sem ajustar o caminho do
# repositorio e as referencias de cache.
name: verificar

on:
  push:
    branches: [main, master]
  pull_request:

# Cancela execucao anterior do mesmo PR quando ha novo push.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portao rapida: nao precisa de servico nenhum para rodar.
  estatico:
    name: Tipos, lint e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # A versao precisa casar com `packageManager` do package.json, senao a
          # instalacao usa um pnpm diferente do que gerou o lockfile.
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `--frozen-lockfile` falha se o lockfile nao bater com o manifesto. E o
      # que garante instalacao reproduzivel.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes unitarios
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # Portao lenta: precisa da stack real do item 18 da especificacao.
  integracao:
    name: Integracao com servicos reais
    runs-on: ubuntu-latest
    # Aplica migration e roda os testes de integracao, que exigem Postgres,
    # Redis e S3 de verdade.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Subir a stack local
        run: |
          cp .env.example .env
          cp .env.test.example .env.test
          docker compose -f infra/docker/docker-compose.yml --env-file .env up -d \
            postgres redis-session redis-queue rustfs
          # Espera o Postgres aceitar conexao, em vez de dormir por tempo fixo.
          for tentativa in $(seq 1 30); do
            if docker compose -f infra/docker/docker-compose.yml --env-file .env \
                 exec -T postgres pg_isready -U sertania_app -d sertania >/dev/null 2>&1; then
              echo "Postgres pronto"
              break
            fi
            sleep 2
          done
          docker compose -f infra/docker/docker-compose.yml --env-file .env ps

      # O banco de teste e separado do banco de trabalho, e os testes de
      # integracao rodam APENAS no de teste. Sem esta etapa os testes usariam o
      # banco das demonstracoes, que e justamente o que a separacao impede.
      - name: Provisionar o banco de teste
        run: pnpm db:test:provision

      - name: Aplicar migrations no banco de teste
        run: pnpm --filter @sertania/api db:test:migrate

      - name: Testes de integracao
        run: pnpm test:integration

      - name: Conferir que o banco de trabalho nao foi tocado
        run: |
          # Evidencia de que a separacao valeu: o banco de trabalho precisa
          # seguir vazio depois de todos os testes. Sem esta checagem, uma
          # configuracao errada passaria despercebida, com os testes verdes e o
          # banco de demonstracao destruido.
          TOTAL=$(docker compose -f infra/docker/docker-compose.yml --env-file .env \
            exec -T postgres psql -U sertania_migrator -d sertania -tAc \
            'select count(*) from users;')
          echo "usuarios no banco de trabalho: $TOTAL"
          if [ "$TOTAL" != "0" ]; then
            echo "::error::os testes de integracao escreveram no banco de trabalho"
            exit 1
          fi

      - name: Registros da execucao
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env down -v
